version: "3.8"

services:
  db:
    image: postgres:13
    container_name: gopher_blog_db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - gopher_blog_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    networks:
      - gopher_blog_network
    restart: always

  app:
    build: .
    container_name: gopher_blog_app
    environment:
      - DB_HOST=db
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - PORT=${PORT}
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      - db
    networks:
      - gopher_blog_network
    restart: always

volumes:
  gopher_blog_data:

networks:
  gopher_blog_network:
    driver: bridge
